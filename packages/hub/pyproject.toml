[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsshub"
version = "0.1.0"
description = "Hub headless de sincronizacion (API JSON + SSE, sin interfaz web)"
requires-python = ">=3.12"
dependencies = [
    "rsscore",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
rsshub = "rsshub.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rsshub"]
