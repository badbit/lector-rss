[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rssdesk"
version = "0.1.0"
description = "Cliente de escritorio PySide6 estilo Liferea"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "rsscore",
    "httpx>=0.27",
    "PySide6>=6.7",
    "qasync>=0.27",
    "desktop-notifier>=6.0",
]

[project.scripts]
rssdesk = "rssdesk.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rssdesk"]
