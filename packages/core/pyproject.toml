[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsscore"
version = "0.1.0"
description = "Nucleo del lector RSS: fetch, parseo, reglas, sincronizacion y exportadores"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.11",
    "httpx[http2]>=0.27",
    "anyio>=4.4",
    "pydantic>=2.8",
    "trafilatura>=1.12",
    "zstandard>=0.23",
    "jinja2>=3.1",
    "markdownify>=0.13",
    "python-dateutil>=2.9",
    "ebooklib>=0.18",
    "pillow>=10.4",
    "aiosmtplib>=3.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
rss = "rsscore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rsscore"]
