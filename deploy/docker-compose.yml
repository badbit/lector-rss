# Hub + ntfy. Pensado para un VPS pequeño o una Raspberry Pi dentro de la tailnet.
#
# Nota importante sobre las notificaciones: si ntfy solo es accesible por
# Tailscale, las alertas llegarán al móvil únicamente con la VPN activa. Si
# quieres avisos siempre, expón SOLO ntfy con TLS y manda notificaciones
# genéricas, sin el título del artículo.
services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./config.yaml:/config/config.yaml:ro
    environment:
      RSS_CONFIG: /config/config.yaml
      RSS_DB: /data/rss.db
    # Sin `ports:` a propósito: se accede por la red de Tailscale del host.
    network_mode: host

  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: http://hub.tu-tailnet.ts.net:8080
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
    volumes:
      - ./ntfy/cache:/var/cache/ntfy
      - ./ntfy/lib:/var/lib/ntfy
    network_mode: host
